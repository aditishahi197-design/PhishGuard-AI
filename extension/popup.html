<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Security Monitor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 320px;
            padding: 18px;
            background: #0f172a;
            color: #f8fafc;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }

        .header img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.01em;
        }

        p.desc {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.45;
            margin-bottom: 14px;
        }

        .toggle-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
        }

        .toggle-label {
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .toggle-btn {
            background: #334155;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 4px 10px;
            font-size: 11.5px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .toggle-btn.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #10b981;
        }

        .toggle-btn.disabled {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .buttons-grid {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        button.action-btn {
            flex: 1;
            padding: 9px 10px;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button.action-btn:hover {
            background: #1d4ed8;
        }

        button.action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button.action-btn.btn-deep {
            background: #4f46e5;
            border-color: #6366f1;
        }

        button.action-btn.btn-deep:hover {
            background: #4338ca;
        }

        .ext-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #status {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.45;
            min-height: 18px;
            word-break: break-word;
        }

        .status-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px 12px;
            margin-top: 10px;
        }

        .status-box strong {
            color: #f8fafc;
        }

        .status-danger {
            border-left: 3px solid #ef4444;
        }

        .status-safe {
            border-left: 3px solid #10b981;
        }

        .status-warning {
            border-left: 3px solid #f59e0b;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icon.png" alt="PhishGuard Shield">
        <h3>PhishGuard Guard</h3>
    </div>

    <div class="toggle-box">
        <span class="toggle-label">Interception Shield</span>
        <button id="toggleInterception" type="button" class="toggle-btn active">Active</button>
    </div>

    <p class="desc" id="policy-desc">
        Suspicious pages and credential harvesters will be intercepted automatically.
    </p>

    <div class="buttons-grid">
        <button id="scan" class="action-btn">
            Inspect Tab
        </button>
        <button id="deepScan" class="action-btn btn-deep">
            Deep Scan
        </button>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>

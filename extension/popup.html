<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Security Monitor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 300px;
            padding: 18px;
            background: #0f172a;
            color: #f8fafc;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }

        .header img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.01em;
        }

        p.desc {
            color: #94a3b8;
            font-size: 12.5px;
            line-height: 1.45;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.4;
            min-height: 18px;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icon.png" alt="PhishGuard Shield">
        <h3>PhishGuard Guard</h3>
    </div>

    <p class="desc">
        Real-time link inspection is active. Suspicious pages and credential harvesters will be intercepted automatically.
    </p>

    <button id="scan">
        Inspect Current Tab
    </button>

    <p id="status"></p>

    <script src="popup.js"></script>
</body>
</html>

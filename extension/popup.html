<!doctype html>
<html>
<head>
    <meta charset="utf-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 280px;
            padding: 16px;
            background: #07111f;
            color: #eef5ff;
        }

        button {
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 8px;
            background: #7db2ff;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #92c0ff;
        }

        p {
            color: #9eb0c5;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <h3>🛡️ PhishGuard AI</h3>

    <p>
        Prototype protection is active. High-risk pages are redirected
        to a local block screen after navigation completes.
    </p>

    <button id="scan">
        Scan current page
    </button>

    <p id="status"></p>

    <script src="popup.js"></script>
</body>
</html>

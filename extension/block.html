<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>PhishGuard AI Blocked</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #070d16;
            color: #eef5ff;
            font-family: Arial, sans-serif;
        }

        .box {
            width: min(620px, 86vw);
            padding: 36px;
            border: 1px solid #7c3945;
            border-radius: 18px;
            background: #16101a;
            text-align: center;
        }

        h1 {
            color: #ffb8c4;
        }

        p {
            color: #aab8ca;
            line-height: 1.5;
            word-break: break-word;
        }

        button {
            padding: 11px 16px;
            border-radius: 9px;
            border: 1px solid #394b63;
            background: #0d1a2a;
            color: #eef5ff;
            cursor: pointer;
        }

        button:hover {
            background: #14263b;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>⛔ PhishGuard AI blocked this page</h1>

        <p id="url"></p>

        <p id="risk"></p>

        <p>
            This is a defensive academic prototype.
            Verify the destination independently before continuing.
        </p>

        <button onclick="history.back()">
            Go back
        </button>
    </div>

    <script>
        const q = new URLSearchParams(location.search);

        document.getElementById("url").textContent =
            q.get("url") || "";

        document.getElementById("risk").textContent =
            "Risk score: " + (q.get("risk") || "unknown") + "%";
    </script>
</body>
</html>
